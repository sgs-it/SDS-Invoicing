{% extends "base.html" %}
{% block title %}Add payment · {{ APP_NAME }}{% endblock %}
{% block crumb %}<a href="{{ url_for('payments.list_payments') }}">Payments</a> / New{% endblock %}
{% block content %}
<div class="page-head"><div><h1>Add payment record</h1><div class="sub">Status is computed automatically from dates and outstanding amount.</div></div></div>

<form method="post" action="{{ url_for('payments.new') }}">
  <div class="card" style="max-width: 820px;">
    <div class="card-body">
      <div class="form-grid">
        <div class="form-group" style="grid-column: 1 / -1;">
          <label>Invoice cycle</label>
          <select name="cycle_id" required>
            <option value="">— Choose a cycle —</option>
            {% for c in cycles %}
            <option value="{{ c.id }}" {{ 'selected' if selected and selected.id == c.id }}>
              {{ c.cycle_name[:60] }} ({{ c.project.client.name }}){% if c.invoice_amount %} — {{ CURRENCY }} {{ "{:,.0f}".format(c.invoice_amount) }}{% endif %}
            </option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group"><label>Invoice amount ({{ CURRENCY }})</label>
          <input name="invoice_amount" type="number" step="0.01" min="0" value="{{ selected.invoice_amount if selected and selected.invoice_amount else '' }}"></div>
        <div class="form-group"><label>Payment due date</label><input type="date" name="payment_due_date"></div>
        <div class="form-group"><label>Expected payment date</label><input type="date" name="expected_payment_date"></div>
        <div class="form-group"><label>Actual payment date</label><input type="date" name="actual_payment_date"></div>
        <div class="form-group"><label>Outstanding amount</label><input name="outstanding_amount" type="number" step="0.01" min="0"></div>
        <div class="form-group"><label>Payment status</label>
          <select name="payment_status">
            {% for s in ['PENDING','PARTIAL','PAID','OVERDUE'] %}<option value="{{ s }}">{{ s }}</option>{% endfor %}
          </select>
          <div class="hint">Will be auto-adjusted by the system.</div></div>
        <div class="form-group" style="grid-column: 1 / -1;"><label>Remarks</label><textarea name="remarks"></textarea></div>
      </div>
    </div>
    <div class="card-foot form-actions">
      <button class="btn" type="submit">Save payment</button>
      <a class="btn ghost" href="{{ url_for('payments.list_payments') }}">Cancel</a>
    </div>
  </div>
</form>
{% endblock %}
