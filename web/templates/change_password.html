{% extends "base.html" %}
{% block title %}Change password · {{ APP_NAME }}{% endblock %}
{% block crumb %}Change password{% endblock %}
{% block content %}
<div class="page-head">
  <div>
    <h1>Change password</h1>
    <div class="sub">Update the password for your account.</div>
  </div>
</div>
<div class="card" style="max-width: 520px;">
  <form method="post" action="{{ url_for('auth.change_password') }}">
    <div class="card-body">
      <div class="form-group">
        <label for="current_password">Current password</label>
        <input id="current_password" type="password" name="current_password" required>
      </div>
      <div class="form-group">
        <label for="new_password">New password</label>
        <input id="new_password" type="password" name="new_password" required>
        <div class="hint">At least 6 characters.</div>
      </div>
      <div class="form-group">
        <label for="confirm_password">Confirm new password</label>
        <input id="confirm_password" type="password" name="confirm_password" required>
      </div>
    </div>
    <div class="card-foot form-actions">
      <button class="btn" type="submit">Update password</button>
      <a class="btn ghost" href="{{ url_for('dashboard.home') }}">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
